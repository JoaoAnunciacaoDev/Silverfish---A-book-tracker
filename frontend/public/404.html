<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>404 — Página não encontrada | Silverfish</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background-color: #020617;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        background-color: rgba(15, 23, 42, 0.85);
        border: 1px solid #1e293b;
        border-radius: 1.5rem;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background-color: rgba(244, 63, 94, 0.1);
        color: #fb7185;
        border: 1px solid rgba(244, 63, 94, 0.2);
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
        color: #ffffff;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.875rem;
        line-height: 1.6;
        color: #94a3b8;
      }
      a {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        border-radius: 0.75rem;
        background-color: #10b981;
        color: #020617;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      a:hover {
        background-color: #34d399;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Erro 404</span>
      <h1>Página não encontrada</h1>
      <p>
        Parece que este capítulo foi arrancado do livro. O endereço acessado não existe ou foi movido.
      </p>
      <a href="/">Voltar para o Silverfish</a>
    </main>
  </body>
</html>
